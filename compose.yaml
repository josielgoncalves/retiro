name: retiro-casais

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-retiro_casais}
      POSTGRES_USER: ${DB_USERNAME:-retiro_casais}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-please}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-retiro_casais} -d ${DB_DATABASE:-retiro_casais}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - retiro

  api:
    build:
      context: ./apps/api
      target: dev
    restart: unless-stopped
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-retiro_casais}
      DB_USERNAME: ${DB_USERNAME:-retiro_casais}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-please}
      SESSION_DOMAIN: localhost
      SANCTUM_STATEFUL_DOMAINS: "localhost:8080,localhost"
      CORS_ALLOWED_ORIGINS: "http://localhost:${NGINX_HTTP_PORT:-8080}"
      DEMO_ADMIN_NAME: ${DEMO_ADMIN_NAME:-Administrador}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-change-me-please}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - retiro

  web:
    build:
      context: ./apps/web
      target: dev
    restart: unless-stopped
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - retiro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/var/www/html/public:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - retiro

networks:
  retiro:
    driver: bridge

volumes:
  postgres_data:
  web_node_modules:
