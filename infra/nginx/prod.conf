# Preserve os cabeçalhos recebidos do proxy HTTPS externo, mas nunca envie
# valores vazios ao Symfony quando o Nginx for acessado diretamente (por
# exemplo, pelo healthcheck local do deploy).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # This Nginx sits behind an external reverse proxy (which will
    # terminate HTTPS). Recover the real client IP from X-Forwarded-For so
    # $remote_addr (and REMOTE_ADDR as seen by PHP-FPM) is accurate — this
    # matters for Laravel's IP-based rate limiting (login, portal access).
    #
    # IMPORTANT: adjust set_real_ip_from to the actual address(es) the
    # external proxy connects from before deploying. Trusting an address
    # that isn't really the proxy lets a client spoof X-Forwarded-For.
    # 172.16.0.0/12 covers the default Docker bridge/custom network range
    # used by this compose project; add the proxy's real IP/CIDR too if it
    # reaches this container some other way (e.g. host networking).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Laravel API, Sanctum's stateful-SPA routes (csrf-cookie, etc.) and the
    # health check all go through the front controller.
    location ~ ^/(api|sanctum|up)(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # Only index.php is ever executed by PHP-FPM — never any other *.php
    # path, even one that matched the block above. This is an exact-match
    # location, which Nginx always prefers over the regex blocks, so every
    # request that reaches PHP (whether rewritten from /api, /sanctum, /up,
    # or hitting /index.php directly) lands here.
    location = /index.php {
        root /var/www/html/public;
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Forward proxy context to Laravel (requires ->trustProxies() to be
        # configured in bootstrap/app.php — see docs/DEPLOY.md).
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_read_timeout 60s;
    }

    # Any other *.php request is rejected outright — direct execution of
    # arbitrary PHP files is never allowed.
    location ~ \.php$ {
        return 404;
    }

    # Quasar SPA (static build)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # O service worker deve ser revalidado a cada acesso para que correções
    # da instalação do portal não fiquem presas no cache do navegador.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
